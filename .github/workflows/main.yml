name: Build Pipeline

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm test -- --watchAll=false
      - run: npm run build

      - run: ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: mvn clean package

      - uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: backend/target/*.war

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/imeschnico/m324/todo-frontend:latest ./frontend
          docker push ghcr.io/imeschnico/m324/todo-frontend:latest

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/imeschnico/m324/todo-backend:latest ./backend
          docker push ghcr.io/imeschnico/m324/todo-backend:latest